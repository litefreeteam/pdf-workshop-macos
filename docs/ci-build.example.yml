name: Build and release macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check image and split engines
        run: swift run -c release WorkshopChecks
      - name: Build universal macOS app
        run: bash build.sh ./dist
      - uses: actions/upload-artifact@v4
        with:
          name: PDFWorkshop-macOS
          path: |
            dist/PDFWorkshop-macOS.zip
            dist/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PDFWorkshop-macOS
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/PDFWorkshop-macOS.zip dist/SHA256SUMS.txt --verify-tag --title "PDF 工坊 $GITHUB_REF_NAME" --notes-file docs/release-notes.md
